<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700"
     font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <!--
    UnTune — 3-Thread Pipeline (landscape infographic)
    Inspired by user's portrait reference but rebuilt landscape for the poster.
  -->

  <defs>
    <!-- Zone gradients -->
    <linearGradient id="g-reader" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#dbeafe"/>
      <stop offset="1" stop-color="#bfdbfe"/>
    </linearGradient>
    <linearGradient id="g-main" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#ede9fe"/>
      <stop offset="1" stop-color="#ddd6fe"/>
    </linearGradient>
    <linearGradient id="g-writer" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#fee2e2"/>
      <stop offset="1" stop-color="#fecaca"/>
    </linearGradient>

    <!-- Sound-wave gradient between stations -->
    <linearGradient id="wave-grad" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%"   stop-color="#7c3aed" stop-opacity="0.2"/>
      <stop offset="50%"  stop-color="#7c3aed" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.2"/>
    </linearGradient>

    <marker id="big-arrow" viewBox="0 0 16 16" refX="13" refY="8"
            markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M0,1 L15,8 L0,15 Z" fill="#1f2937"/>
    </marker>

    <style>
      .title    { font-size: 30px; font-weight: 800; fill: #1f2937; }
      .subtitle { font-size: 14px; fill: #6b7280; }
      .zone-lbl { font-size: 13px; font-weight: 800; letter-spacing: 3px; }
      .station  { font-size: 22px; font-weight: 800; fill: #1f2937; }
      .desc     { font-size: 13px; fill: #374151; }
      .desc-em  { font-size: 13px; fill: #1f2937; font-weight: 600; }
      .queue-t  { font-size: 14px; font-weight: 800; font-family: 'Courier New', monospace; fill: #92400e; }
      .queue-s  { font-size: 11px; fill: #92400e; }
      .stat-n   { font-size: 22px; font-weight: 800; fill: #1f2937; }
      .stat-l   { font-size: 10.5px; font-weight: 700; letter-spacing: 1.5px; fill: #6b7280; }
    </style>
  </defs>

  <rect width="1600" height="700" fill="white"/>

  <!-- ═════════════════════════════ TITLE ═════════════════════════════ -->
  <text x="800" y="46" text-anchor="middle" class="title">UnTune</text>
  <text x="800" y="73" text-anchor="middle" class="subtitle">
    The 3-Thread Real-Time Streaming Pipeline
  </text>

  <!-- ═════════════════════════════ STATION 1 — READER ═════════════════════════════ -->
  <g>
    <rect x="40" y="110" width="380" height="380" rx="20"
          fill="url(#g-reader)" stroke="#3b82f6" stroke-width="2.5"/>
    <text x="60" y="140" class="zone-lbl" fill="#1e40af">READER THREAD</text>
    <text x="60" y="158" class="queue-s" fill="#3b82f6" letter-spacing="0">via VB-Cable virtual driver</text>

    <!-- Microphone icon -->
    <g transform="translate(230,235)" stroke="#1e40af" stroke-width="3" fill="white" stroke-linecap="round" stroke-linejoin="round">
      <!-- Mic capsule -->
      <rect x="-26" y="-50" width="52" height="78" rx="26" fill="#3b82f6"/>
      <!-- Mic detail lines -->
      <line x1="-10" y1="-30" x2="10" y2="-30" stroke="white" stroke-width="2"/>
      <line x1="-10" y1="-10" x2="10" y2="-10" stroke="white" stroke-width="2"/>
      <line x1="-10" y1="10"  x2="10" y2="10"  stroke="white" stroke-width="2"/>
      <!-- U-bracket -->
      <path d="M-44,0 C -44,28 -28,46 0,46 C 28,46 44,28 44,0" fill="none"/>
      <!-- Stand -->
      <line x1="0" y1="46" x2="0" y2="74"/>
      <line x1="-22" y1="74" x2="22" y2="74"/>
    </g>

    <text x="230" y="385" text-anchor="middle" class="station">Capture</text>
    <text x="60"  y="425" class="desc-em">Reads raw system audio in</text>
    <text x="60"  y="445" class="desc">8 192-sample chunks (186 ms each).</text>
    <text x="60"  y="465" class="desc">Pushes each chunk to the input</text>
    <text x="60"  y="481" class="desc">queue · drops oldest when full.</text>
  </g>

  <!-- ═════════════════════════════ in_q ═════════════════════════════ -->
  <g transform="translate(440,300)">
    <!-- Sound-wave bars between reader & main -->
    <g fill="url(#wave-grad)">
      <rect x="-12" y="-22" width="4" height="44" rx="2"/>
      <rect x="-4"  y="-12" width="4" height="24" rx="2"/>
      <rect x="4"   y="-30" width="4" height="60" rx="2"/>
      <rect x="12"  y="-18" width="4" height="36" rx="2"/>
      <rect x="20"  y="-24" width="4" height="48" rx="2"/>
      <rect x="28"  y="-14" width="4" height="28" rx="2"/>
      <rect x="36"  y="-26" width="4" height="52" rx="2"/>
      <rect x="44"  y="-20" width="4" height="40" rx="2"/>
      <rect x="52"  y="-30" width="4" height="60" rx="2"/>
      <rect x="60"  y="-16" width="4" height="32" rx="2"/>
      <rect x="68"  y="-22" width="4" height="44" rx="2"/>
      <rect x="76"  y="-10" width="4" height="20" rx="2"/>
    </g>
    <!-- in_q label below -->
    <rect x="2" y="60" width="80" height="36" rx="18" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="42" y="80" text-anchor="middle" class="queue-t">in_q</text>
    <text x="42" y="115" text-anchor="middle" class="queue-s">buffer (size 4)</text>
  </g>

  <!-- arrow reader → main -->
  <line x1="420" y1="280" x2="540" y2="280" stroke="#1f2937" stroke-width="3" marker-end="url(#big-arrow)"/>

  <!-- ═════════════════════════════ STATION 2 — MAIN ═════════════════════════════ -->
  <g>
    <rect x="540" y="90" width="520" height="420" rx="20"
          fill="url(#g-main)" stroke="#7c3aed" stroke-width="3"/>
    <text x="560" y="120" class="zone-lbl" fill="#5b21b6">MAIN THREAD  ·  GPU</text>
    <text x="560" y="138" class="queue-s" fill="#7c3aed" letter-spacing="0">HSTasNet v12 inference loop</text>

    <!-- Neural network icon (3-column layered graph) -->
    <g transform="translate(800,260)">
      <!-- Edges -->
      <g stroke="#7c3aed" stroke-width="1.5" opacity="0.4">
        <!-- col1 → col2 -->
        <line x1="-100" y1="-60" x2="0" y2="-60"/>
        <line x1="-100" y1="-60" x2="0" y2="-20"/>
        <line x1="-100" y1="-60" x2="0" y2="20"/>
        <line x1="-100" y1="-60" x2="0" y2="60"/>
        <line x1="-100" y1="-20" x2="0" y2="-60"/>
        <line x1="-100" y1="-20" x2="0" y2="-20"/>
        <line x1="-100" y1="-20" x2="0" y2="20"/>
        <line x1="-100" y1="-20" x2="0" y2="60"/>
        <line x1="-100" y1="20"  x2="0" y2="-60"/>
        <line x1="-100" y1="20"  x2="0" y2="-20"/>
        <line x1="-100" y1="20"  x2="0" y2="20"/>
        <line x1="-100" y1="20"  x2="0" y2="60"/>
        <line x1="-100" y1="60"  x2="0" y2="-60"/>
        <line x1="-100" y1="60"  x2="0" y2="-20"/>
        <line x1="-100" y1="60"  x2="0" y2="20"/>
        <line x1="-100" y1="60"  x2="0" y2="60"/>
        <!-- col2 → col3 -->
        <line x1="0" y1="-60" x2="100" y2="-40"/>
        <line x1="0" y1="-60" x2="100" y2="0"/>
        <line x1="0" y1="-60" x2="100" y2="40"/>
        <line x1="0" y1="-20" x2="100" y2="-40"/>
        <line x1="0" y1="-20" x2="100" y2="0"/>
        <line x1="0" y1="-20" x2="100" y2="40"/>
        <line x1="0" y1="20"  x2="100" y2="-40"/>
        <line x1="0" y1="20"  x2="100" y2="0"/>
        <line x1="0" y1="20"  x2="100" y2="40"/>
        <line x1="0" y1="60"  x2="100" y2="-40"/>
        <line x1="0" y1="60"  x2="100" y2="0"/>
        <line x1="0" y1="60"  x2="100" y2="40"/>
      </g>
      <!-- Nodes -->
      <g fill="#7c3aed" stroke="white" stroke-width="2">
        <circle cx="-100" cy="-60" r="10"/>
        <circle cx="-100" cy="-20" r="10"/>
        <circle cx="-100" cy="20"  r="10"/>
        <circle cx="-100" cy="60"  r="10"/>
        <circle cx="0"    cy="-60" r="10"/>
        <circle cx="0"    cy="-20" r="10"/>
        <circle cx="0"    cy="20"  r="10"/>
        <circle cx="0"    cy="60"  r="10"/>
        <circle cx="100"  cy="-40" r="10"/>
        <circle cx="100"  cy="0"   r="10"/>
        <circle cx="100"  cy="40"  r="10"/>
      </g>
    </g>

    <text x="800" y="385" text-anchor="middle" class="station">Predict mask</text>
    <text x="560" y="425" class="desc-em">5 stacked LSTM blocks persist hidden state between chunks,</text>
    <text x="560" y="445" class="desc">predicting a complex mask per time-frequency bin.</text>
    <text x="560" y="473" class="desc-em">Cross-fades each chunk with the previous one (23 ms blend)</text>
    <text x="560" y="493" class="desc">to mask STFT-boundary artefacts.</text>
  </g>

  <!-- ═════════════════════════════ out_q ═════════════════════════════ -->
  <g transform="translate(1080,300)">
    <g fill="url(#wave-grad)">
      <rect x="-12" y="-22" width="4" height="44" rx="2"/>
      <rect x="-4"  y="-30" width="4" height="60" rx="2"/>
      <rect x="4"   y="-14" width="4" height="28" rx="2"/>
      <rect x="12"  y="-26" width="4" height="52" rx="2"/>
      <rect x="20"  y="-18" width="4" height="36" rx="2"/>
      <rect x="28"  y="-24" width="4" height="48" rx="2"/>
      <rect x="36"  y="-12" width="4" height="24" rx="2"/>
      <rect x="44"  y="-30" width="4" height="60" rx="2"/>
      <rect x="52"  y="-20" width="4" height="40" rx="2"/>
      <rect x="60"  y="-16" width="4" height="32" rx="2"/>
      <rect x="68"  y="-22" width="4" height="44" rx="2"/>
      <rect x="76"  y="-10" width="4" height="20" rx="2"/>
    </g>
    <rect x="-2" y="60" width="92" height="36" rx="18" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="44" y="80" text-anchor="middle" class="queue-t">out_q</text>
    <text x="44" y="115" text-anchor="middle" class="queue-s">buffer (size 4)</text>
  </g>

  <!-- arrow main → writer -->
  <line x1="1060" y1="280" x2="1180" y2="280" stroke="#1f2937" stroke-width="3" marker-end="url(#big-arrow)"/>

  <!-- ═════════════════════════════ STATION 3 — WRITER ═════════════════════════════ -->
  <g>
    <rect x="1180" y="110" width="380" height="380" rx="20"
          fill="url(#g-writer)" stroke="#dc2626" stroke-width="2.5"/>
    <text x="1200" y="140" class="zone-lbl" fill="#9f1239">WRITER THREAD</text>
    <text x="1200" y="158" class="queue-s" fill="#dc2626" letter-spacing="0">WASAPI player · auto-reconnect</text>

    <!-- Speaker icon -->
    <g transform="translate(1370,250)" stroke="#9f1239" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <!-- Cabinet -->
      <rect x="-50" y="-72" width="100" height="144" rx="8" fill="white"/>
      <!-- Top driver (small) -->
      <circle cx="0" cy="-40" r="14" fill="#fee2e2"/>
      <circle cx="0" cy="-40" r="4"  fill="#9f1239"/>
      <!-- Bottom driver (big) -->
      <circle cx="0" cy="32"  r="26" fill="#dc2626"/>
      <circle cx="0" cy="32"  r="8"  fill="#9f1239"/>
      <!-- Sound waves emitting right -->
      <path d="M58,12  C 76,22  76,42 58,52"  fill="none"/>
      <path d="M76,2   C 100,16 100,48 76,62" fill="none"/>
      <path d="M94,-8  C 124,10 124,54 94,72" fill="none" opacity="0.6"/>
    </g>

    <text x="1370" y="385" text-anchor="middle" class="station">Play</text>
    <text x="1200" y="425" class="desc-em">Pulls processed chunks from out_q</text>
    <text x="1200" y="445" class="desc">and streams them to real speakers.</text>
    <text x="1200" y="465" class="desc">Decouples GPU inference time from</text>
    <text x="1200" y="481" class="desc">the strict audio-playback clock.</text>
  </g>

  <!-- ═════════════════════════════ BOTTOM STRIP — BLOCK SIZE / LATENCY ═════════════════════════════ -->
  <rect x="40" y="540" width="1520" height="130" rx="14"
        fill="#f9fafb" stroke="#9ca3af" stroke-width="1.3" stroke-dasharray="4 4"/>
  <text x="60" y="568" class="zone-lbl" fill="#374151">BLOCK SIZE × LATENCY TRADE-OFF</text>

  <!-- 4 stats spread across -->
  <g>
    <line x1="412" y1="585" x2="412" y2="660" stroke="#d1d5db"/>
    <line x1="794" y1="585" x2="794" y2="660" stroke="#d1d5db"/>
    <line x1="1176" y1="585" x2="1176" y2="660" stroke="#d1d5db"/>
  </g>

  <g transform="translate(220,610)" text-anchor="middle">
    <text class="stat-n">2 048</text>
    <text y="22" class="stat-l">SAMPLES  ·  46 ms</text>
    <text y="44" class="queue-s" fill="#9f1239">needs fast GPU</text>
  </g>

  <g transform="translate(602,610)" text-anchor="middle">
    <text class="stat-n">4 096</text>
    <text y="22" class="stat-l">SAMPLES  ·  93 ms</text>
    <text y="44" class="queue-s" fill="#9f1239">tight on CPU</text>
  </g>

  <g transform="translate(986,610)" text-anchor="middle">
    <text class="stat-n" fill="#5b21b6">8 192</text>
    <text y="22" class="stat-l" fill="#5b21b6">SAMPLES  ·  186 ms</text>
    <text y="44" class="queue-s" fill="#047857">recommended ✓</text>
  </g>

  <g transform="translate(1370,610)" text-anchor="middle">
    <text class="stat-n">16 384</text>
    <text y="22" class="stat-l">SAMPLES  ·  372 ms</text>
    <text y="44" class="queue-s" fill="#374151">bullet-proof</text>
  </g>
</svg>
