<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 420"
     font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <!--
    UnTune — Simple Flowchart (poster, landscape).
    4 steps, plain language, designed for non-technical readers.
    Pairs with the detailed block diagram on the left side of the poster.
  -->

  <defs>
    <linearGradient id="s1" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#eef4ff"/><stop offset="1" stop-color="#cfddff"/>
    </linearGradient>
    <linearGradient id="s2" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#fff6e8"/><stop offset="1" stop-color="#ffd991"/>
    </linearGradient>
    <linearGradient id="s3" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#f5efff"/><stop offset="1" stop-color="#d6bbff"/>
    </linearGradient>
    <linearGradient id="s4" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#ffeef2"/><stop offset="1" stop-color="#ffb8c8"/>
    </linearGradient>

    <marker id="arrowBig" viewBox="0 0 16 16" refX="13" refY="8"
            markerWidth="13" markerHeight="13" orient="auto-start-reverse">
      <path d="M0,1 L15,8 L0,15 Z" fill="#1f2937"/>
    </marker>

    <style>
      .num   { font-size: 30px; font-weight: 800; }
      .title { font-size: 19px; font-weight: 700; fill: #1f2937; }
      .body  { font-size: 13.5px; fill: #374151; }
    </style>
  </defs>

  <!-- ─── Step 1 — Play audio ─────────────────────────────────────── -->
  <g>
    <rect x="20" y="40" width="280" height="280" rx="16"
          fill="url(#s1)" stroke="#3b82f6" stroke-width="2"/>
    <text x="38" y="78" class="num" fill="#1e40af">1</text>

    <!-- Phone / app icon -->
    <g transform="translate(160,130)">
      <rect x="-26" y="-32" width="52" height="64" rx="8"
            fill="white" stroke="#1e40af" stroke-width="2.5"/>
      <circle cx="0" cy="22" r="3" fill="#1e40af"/>
      <rect x="-18" y="-26" width="36" height="38" rx="3"
            fill="#3b82f6" opacity="0.25"/>
      <path d="M-10,-4 L-2,-10 L-2,2 Z M6,-10 v12" stroke="#1e40af"
            stroke-width="2.2" fill="#1e40af" stroke-linejoin="round"/>
    </g>

    <text x="160" y="220" text-anchor="middle" class="title">You play something</text>
    <text x="160" y="252" text-anchor="middle" class="body">a song · video · podcast</text>
    <text x="160" y="272" text-anchor="middle" class="body">on any app you already use</text>
  </g>

  <!-- ─── Arrow 1 → 2 ─────────────────────────────────────────────── -->
  <line x1="305" y1="180" x2="345" y2="180"
        stroke="#1f2937" stroke-width="3.5" marker-end="url(#arrowBig)"/>

  <!-- ─── Step 2 — UnTune captures it ─────────────────────────────── -->
  <g>
    <rect x="350" y="40" width="280" height="280" rx="16"
          fill="url(#s2)" stroke="#f59e0b" stroke-width="2"/>
    <text x="368" y="78" class="num" fill="#92400e">2</text>

    <!-- Capture icon: arrow into a box -->
    <g transform="translate(490,130)">
      <rect x="-38" y="-22" width="76" height="44" rx="10"
            fill="white" stroke="#92400e" stroke-width="2.5"/>
      <path d="M-60,0 L-10,0" stroke="#92400e" stroke-width="3"/>
      <path d="M-22,-10 L-10,0 L-22,10" stroke="#92400e"
            stroke-width="3" fill="none" stroke-linejoin="round"
            stroke-linecap="round"/>
      <text x="0" y="6" text-anchor="middle" font-size="13"
            font-weight="700" fill="#92400e">audio</text>
    </g>

    <text x="490" y="220" text-anchor="middle" class="title">UnTune catches it</text>
    <text x="490" y="252" text-anchor="middle" class="body">a virtual cable redirects</text>
    <text x="490" y="272" text-anchor="middle" class="body">all sound into the app</text>
  </g>

  <!-- ─── Arrow 2 → 3 ─────────────────────────────────────────────── -->
  <line x1="635" y1="180" x2="675" y2="180"
        stroke="#1f2937" stroke-width="3.5" marker-end="url(#arrowBig)"/>

  <!-- ─── Step 3 — AI removes music ───────────────────────────────── -->
  <g>
    <rect x="680" y="40" width="280" height="280" rx="16"
          fill="url(#s3)" stroke="#7c3aed" stroke-width="2.5"/>
    <text x="698" y="78" class="num" fill="#5b21b6">3</text>

    <!-- Brain icon -->
    <g transform="translate(820,130)" fill="white" stroke="#5b21b6" stroke-width="2.5" stroke-linejoin="round">
      <path d="M-30,-6 C -34,-22 -16,-32 -2,-26 C 4,-32 22,-30 26,-16
               C 36,-10 32,8 22,12 C 24,26 8,32 -4,24
               C -18,30 -32,18 -30,4 C -38,-2 -38,-6 -30,-6 Z"/>
      <path d="M-2,-26 L-2,24 M-10,-10 L4,-2 M-14,8 L8,12"
            fill="none" stroke="#5b21b6" stroke-width="2"/>
    </g>

    <text x="820" y="220" text-anchor="middle" class="title">AI removes the music</text>
    <text x="820" y="252" text-anchor="middle" class="body">the neural network keeps</text>
    <text x="820" y="272" text-anchor="middle" class="body">the voice, silences the rest</text>
  </g>

  <!-- ─── Arrow 3 → 4 ─────────────────────────────────────────────── -->
  <line x1="965" y1="180" x2="1005" y2="180"
        stroke="#1f2937" stroke-width="3.5" marker-end="url(#arrowBig)"/>

  <!-- ─── Step 4 — You hear vocals ────────────────────────────────── -->
  <g>
    <rect x="1010" y="40" width="280" height="280" rx="16"
          fill="url(#s4)" stroke="#dc2626" stroke-width="2"/>
    <text x="1028" y="78" class="num" fill="#9f1239">4</text>

    <!-- Speaker / sound-wave icon -->
    <g transform="translate(1150,130)" fill="white" stroke="#9f1239" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
      <path d="M-26,-12 L-12,-12 L4,-24 L4,24 L-12,12 L-26,12 Z" fill="#9f1239"/>
      <path d="M14,-12 C 22,-6 22,6 14,12" fill="none" stroke="#9f1239"/>
      <path d="M22,-20 C 34,-10 34,10 22,20" fill="none" stroke="#9f1239"/>
    </g>

    <text x="1150" y="220" text-anchor="middle" class="title">You hear vocals only</text>
    <text x="1150" y="252" text-anchor="middle" class="body">through your speakers,</text>
    <text x="1150" y="272" text-anchor="middle" class="body">with under half a second of delay</text>
  </g>

  <!-- ─── Bottom strap: speed callout ─────────────────────────────── -->
  <rect x="20" y="355" width="1270" height="50" rx="12"
        fill="#f9fafb" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="4 4"/>
  <text x="660" y="386" text-anchor="middle" font-size="14.5"
        font-style="italic" fill="#374151">
    ⚡ All four steps happen continuously, in real time — about 190 ms from when the music plays to when the voice reaches your ears.
  </text>
</svg>
