<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- Concept D: "UnTune fork" — a stylised tuning fork where one prong is
       broken/dimmed, leaving a single clean prong (the voice).  Reads as
       "un-tuned" / one frequency cancelled, one preserved.  Most distinctive
       and abstract; works extremely well as favicon. -->

  <!-- Base (handle) -->
  <rect x="29" y="38" width="6" height="18" rx="2" fill="oklch(0.68 0.21 295)"/>

  <!-- Left prong: full, glowing — the "kept" voice -->
  <path
    d="M21 38 L21 14"
    stroke="oklch(0.78 0.16 200)"
    stroke-width="5"
  />
  <!-- Small sound dot on top of the kept prong -->
  <circle cx="21" cy="10" r="3" fill="oklch(0.78 0.16 200)"/>

  <!-- Right prong: short, broken/cut — the "removed" music -->
  <path
    d="M43 38 L43 26"
    stroke="oklch(0.68 0.24 25)"
    stroke-width="5"
    opacity="0.85"
  />
  <!-- Diagonal cut line across the broken prong -->
  <line
    x1="38" y1="20" x2="48" y2="14"
    stroke="oklch(0.68 0.24 25)"
    stroke-width="3"
    opacity="0.85"
  />

  <!-- Crossbar connecting the prongs -->
  <path
    d="M19 38 L45 38"
    stroke="oklch(0.68 0.21 295)"
    stroke-width="5"
  />
</svg>
